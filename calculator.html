<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hello — Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="d-flex flex-column align-items-center">
  <div class="container" style="max-width: 560px;">
    <nav class="navbar navbar-expand bg-white rounded-4 shadow-sm px-3 py-2 mt-3" aria-label="Main navigation">
      <div class="container-fluid p-0">
        <a class="navbar-brand fw-bold gradient-text" href="index.html">Hello</a>
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link px-3" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3 active" aria-current="page" href="calculator.html">Calculator</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3" href="todo.html">Todo</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="mt-4 mb-3">
      <h1 class="text-white fw-bold text-center mb-3">Calculator</h1>
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <div class="calc-display mb-3" id="display" aria-live="polite">0</div>
          <div class="calc-grid">
            <button type="button" class="btn btn-outline-danger" data-key="C" aria-label="Clear">C</button>
            <button type="button" class="btn btn-outline-secondary" data-key="&#9003;" aria-label="Backspace">&#9003;</button>
            <button type="button" class="btn btn-outline-secondary" data-key="/">&#247;</button>
            <button type="button" class="btn btn-outline-secondary" data-key="*">&#215;</button>
            <button type="button" class="btn btn-light" data-key="7">7</button>
            <button type="button" class="btn btn-light" data-key="8">8</button>
            <button type="button" class="btn btn-light" data-key="9">9</button>
            <button type="button" class="btn btn-outline-secondary" data-key="-">&#8722;</button>
            <button type="button" class="btn btn-light" data-key="4">4</button>
            <button type="button" class="btn btn-light" data-key="5">5</button>
            <button type="button" class="btn btn-light" data-key="6">6</button>
            <button type="button" class="btn btn-outline-secondary" data-key="+">+</button>
            <button type="button" class="btn btn-light" data-key="1">1</button>
            <button type="button" class="btn btn-light" data-key="2">2</button>
            <button type="button" class="btn btn-light" data-key="3">3</button>
            <button type="button" class="btn btn-eq span-2-rows" data-key="=">=</button>
            <button type="button" class="btn btn-light span-2" data-key="0">0</button>
            <button type="button" class="btn btn-light" data-key=".">.</button>
          </div>
          <p class="text-muted small text-center mt-3 mb-0">
            Keyboard: digits, + &minus; &times; &divide;, Enter, Esc, Backspace
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
    const display = document.getElementById('display');

    let acc = null;
    let op = null;
    let entry = '';
    let fresh = false;
    let error = false;

    function fmt(x) {
      let s = String(parseFloat(x.toPrecision(12)));
      if (s.length > 14) s = x.toExponential(8);
      return s;
    }

    function compute(a, b, o) {
      switch (o) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? Infinity : a / b;
      }
    }

    function showError() {
      error = true;
      acc = null;
      op = null;
      entry = '';
      fresh = false;
      display.textContent = 'Error';
    }

    function handleClear() {
      error = false;
      acc = null;
      op = null;
      entry = '';
      fresh = false;
      display.textContent = '0';
    }

    function handleDigit(d) {
      if (error) handleClear();
      if (fresh) {
        entry = '';
        fresh = false;
      }
      if (entry.length >= 14) return;
      entry = entry === '0' ? d : entry + d;
      display.textContent = entry;
    }

    function handleDot() {
      if (error) handleClear();
      if (fresh) {
        entry = '';
        fresh = false;
      }
      if (entry.includes('.')) return;
      entry = entry === '' ? '0.' : entry + '.';
      display.textContent = entry;
    }

    function handleOp(o) {
      if (error) return;
      if (fresh && acc !== null && op !== null) {
        op = o;
        return;
      }
      if (entry !== '') {
        const val = parseFloat(entry);
        if (acc === null) {
          acc = val;
        } else if (op !== null) {
          const r = compute(acc, val, op);
          if (!isFinite(r)) return showError();
          acc = r;
        }
        op = o;
        entry = '';
        fresh = false;
        display.textContent = fmt(acc);
      } else if (acc !== null) {
        op = o;
      }
    }

    function handleEquals() {
      if (error) return;
      if (op !== null && entry !== '') {
        const r = compute(acc, parseFloat(entry), op);
        if (!isFinite(r)) return showError();
        entry = fmt(r);
        acc = null;
        op = null;
        fresh = true;
        display.textContent = entry;
      } else if (op !== null && acc !== null) {
        entry = fmt(acc);
        acc = null;
        op = null;
        fresh = true;
        display.textContent = entry;
      }
    }

    function handleBackspace() {
      if (error || fresh) return;
      entry = entry.slice(0, -1);
      display.textContent = entry === '' ? '0' : entry;
    }

    document.querySelectorAll('.calc-grid .btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.key;
        if (/^[0-9]$/.test(k)) handleDigit(k);
        else if (k === '.') handleDot();
        else if (k === 'C') handleClear();
        else if (k === '\u232B') handleBackspace();
        else if (k === '=') handleEquals();
        else handleOp(k);
      });
    });

    window.addEventListener('keydown', (e) => {
      if (/^[0-9]$/.test(e.key)) handleDigit(e.key);
      else if (e.key === '.') handleDot();
      else if (['+', '-', '*', '/'].includes(e.key)) {
        e.preventDefault();
        handleOp(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        handleEquals();
      } else if (e.key === 'Backspace') {
        handleBackspace();
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        handleClear();
      }
    });
  </script>
</body>
</html>
