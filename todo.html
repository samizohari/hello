<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hello — Todo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="d-flex flex-column align-items-center">
  <div class="container" style="max-width: 620px;">
    <nav class="navbar navbar-expand bg-white rounded-4 shadow-sm px-3 py-2 mt-3" aria-label="Main navigation">
      <div class="container-fluid p-0">
        <a class="navbar-brand fw-bold gradient-text" href="index.html">Hello</a>
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link px-3" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3" href="calculator.html">Calculator</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3 active" aria-current="page" href="todo.html">Todo</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="mt-4 mb-3">
      <h1 class="text-white fw-bold text-center mb-3">Todo List</h1>
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">
          <form id="todo-form" class="input-group mb-3">
            <input id="todo-input" class="form-control" type="text" placeholder="What needs to be done?" maxlength="200" autocomplete="off" />
            <button class="btn btn-primary" type="submit">Add</button>
          </form>

          <ul id="todo-list" class="list-group list-group-flush"></ul>

          <div class="d-flex flex-wrap gap-2 mt-3">
            <button class="btn btn-outline-secondary btn-sm" id="btn-export">Export CSV</button>
            <label class="btn btn-outline-secondary btn-sm mb-0" for="file-import">Import CSV</label>
            <input type="file" id="file-import" accept=".csv,text/csv" hidden />
            <button class="btn btn-outline-secondary btn-sm" id="btn-open" hidden>Open CSV file</button>
            <button class="btn btn-outline-secondary btn-sm" id="btn-save" hidden>Save CSV file</button>
            <button class="btn btn-outline-danger btn-sm" id="btn-clear-done">Clear done</button>
          </div>

          <p class="text-muted small text-center mt-3 mb-0" id="status">
            Edits are saved automatically in this browser and can be exported to todos.csv.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script>
    const STORAGE_KEY = 'hello.todos';

    const listEl = document.getElementById('todo-list');
    const formEl = document.getElementById('todo-form');
    const inputEl = document.getElementById('todo-input');
    const statusEl = document.getElementById('status');
    const exportBtn = document.getElementById('btn-export');
    const fileInput = document.getElementById('file-import');
    const openBtn = document.getElementById('btn-open');
    const saveBtn = document.getElementById('btn-save');
    const clearDoneBtn = document.getElementById('btn-clear-done');

    let todos = [];
    let editingId = null;
    let boundFile = null;

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function csvEscape(s) {
      s = String(s);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function toCSV(items) {
      const lines = ['id,title,done,created_at'];
      for (const t of items) {
        lines.push(
          [csvEscape(t.id), csvEscape(t.title), csvEscape(t.done), csvEscape(t.created)].join(',')
        );
      }
      return lines.join('\n');
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            field += c;
          }
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field);
          field = '';
        } else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(field);
          field = '';
          if (row.some((f) => f !== '')) rows.push(row);
          row = [];
        } else {
          field += c;
        }
      }
      if (field !== '' || row.length > 0) {
        row.push(field);
        if (row.some((f) => f !== '')) rows.push(row);
      }
      return rows;
    }

    function rowsToTodos(rows) {
      const first = rows[0] || [];
      const hasHeader =
        first.length >= 2 && /^id$/i.test(String(first[0]).trim()) && /^title$/i.test(String(first[1]).trim());
      const start = hasHeader ? 1 : 0;
      const items = [];
      for (let i = start; i < rows.length; i++) {
        const r = rows[i];
        const title = String(r[1] || '').trim();
        if (!title) continue;
        items.push({
          id: r[0] ? String(r[0]) : generateId(),
          title: title,
          done: r[2] === 'true' || r[2] === '1',
          created: r[3] || new Date().toISOString(),
        });
      }
      return items;
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        todos = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(todos)) todos = [];
      } catch (e) {
        todos = [];
      }
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        /* storage unavailable — keep working in memory */
      }
      if (boundFile && window.showSaveFilePicker) {
        boundFile
          .createWritable()
          .then((w) => w.write(toCSV(todos)).then(() => w.close()))
          .catch(() => {});
      }
    }

    function save() {
      persist();
      render();
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function addTodo(title) {
      todos.push({ id: generateId(), title: title, done: false, created: new Date().toISOString() });
      save();
    }

    function toggleTodo(id) {
      const t = todos.find((x) => x.id === id);
      if (t) {
        t.done = !t.done;
        save();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter((x) => x.id !== id);
      if (editingId === id) editingId = null;
      save();
    }

    function editTodo(id, newTitle) {
      const t = todos.find((x) => x.id === id);
      const title = String(newTitle || '').trim();
      if (!t) return;
      editingId = null;
      if (!title) {
        deleteTodo(id);
        return;
      }
      t.title = title;
      save();
    }

    function clearDone() {
      todos = todos.filter((t) => !t.done);
      save();
    }

    function render() {
      listEl.textContent = '';
      if (todos.length === 0) {
        const li = document.createElement('li');
        li.className = 'list-group-item text-center text-muted py-4';
        li.textContent = 'Nothing here yet — add a task above.';
        listEl.appendChild(li);
        return;
      }
      todos.forEach((t) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex align-items-center gap-2 px-3' + (t.done ? ' todo-done' : '');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'form-check-input mt-0 flex-shrink-0';
        cb.checked = t.done;
        cb.addEventListener('change', () => toggleTodo(t.id));
        li.appendChild(cb);

        if (editingId === t.id) {
          const ed = document.createElement('input');
          ed.type = 'text';
          ed.className = 'form-control form-control-sm flex-grow-1';
          ed.value = t.title;
          ed.maxLength = 200;

          const ok = document.createElement('button');
          ok.className = 'btn btn-primary btn-sm flex-shrink-0';
          ok.textContent = 'Save';
          ok.addEventListener('click', () => editTodo(t.id, ed.value));

          const cancel = document.createElement('button');
          cancel.className = 'btn btn-outline-secondary btn-sm flex-shrink-0';
          cancel.textContent = 'Cancel';
          cancel.addEventListener('click', () => {
            editingId = null;
            render();
          });

          ed.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') editTodo(t.id, ed.value);
            else if (e.key === 'Escape') {
              editingId = null;
              render();
            }
          });

          li.appendChild(ed);
          li.appendChild(ok);
          li.appendChild(cancel);
          setTimeout(() => ed.focus(), 0);
        } else {
          const span = document.createElement('span');
          span.className = 'todo-title flex-grow-1';
          span.textContent = t.title;
          li.appendChild(span);

          const editBtn = document.createElement('button');
          editBtn.className = 'btn btn-outline-secondary btn-sm flex-shrink-0';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', () => {
            editingId = t.id;
            render();
          });
          li.appendChild(editBtn);

          const delBtn = document.createElement('button');
          delBtn.className = 'btn btn-outline-danger btn-sm flex-shrink-0';
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', () => deleteTodo(t.id));
          li.appendChild(delBtn);
        }

        listEl.appendChild(li);
      });
    }

    function importCSVFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const rows = parseCSV(String(reader.result || ''));
        const imported = rowsToTodos(rows);
        if (imported.length === 0) {
          setStatus('No valid todo rows found in that CSV.');
          return;
        }
        todos = imported;
        editingId = null;
        save();
        setStatus('Imported ' + imported.length + ' item(s) from ' + file.name + '.');
      };
      reader.readAsText(file);
    }

    function exportCSV() {
      const blob = new Blob([toCSV(todos)], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'todos.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      setStatus('Exported ' + todos.length + ' item(s) to todos.csv.');
    }

    const fsSupported = typeof window !== 'undefined' && 'showOpenFilePicker' in window;
    if (fsSupported) {
      openBtn.hidden = false;
      saveBtn.hidden = false;

      openBtn.addEventListener('click', async () => {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }],
          });
          boundFile = handle;
          const file = await handle.getFile();
          importCSVFile(file);
          setStatus('Bound to ' + handle.name + ' — every edit is written to the file.');
        } catch (err) {
          if (err.name !== 'AbortError') setStatus('Could not open file: ' + err.message);
        }
      });

      saveBtn.addEventListener('click', async () => {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'todos.csv',
            types: [{ description: 'CSV', accept: { 'text/csv': ['.csv'] } }],
          });
          boundFile = handle;
          const w = await handle.createWritable();
          await w.write(toCSV(todos));
          await w.close();
          setStatus('Saved ' + todos.length + ' item(s) to ' + handle.name + ' — every edit now writes there.');
        } catch (err) {
          if (err.name !== 'AbortError') setStatus('Could not save file: ' + err.message);
        }
      });
    }

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = inputEl.value.trim();
      if (!title) return;
      addTodo(title);
      inputEl.value = '';
      inputEl.focus();
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files[0]) importCSVFile(fileInput.files[0]);
      fileInput.value = '';
    });

    exportBtn.addEventListener('click', exportCSV);

    clearDoneBtn.addEventListener('click', () => {
      const n = todos.filter((t) => t.done).length;
      clearDone();
      if (n > 0) setStatus('Removed ' + n + ' completed item(s).');
    });

    load();
    render();
  </script>
</body>
</html>
