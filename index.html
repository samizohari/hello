<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello — Ping Pong</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 2rem 1rem;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 860px;
    }

    .sign {
      padding: 1.75rem 4rem;
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .sign h1 {
      font-size: 3.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.05em;
    }

    .game-card {
      width: 100%;
      padding: 1.5rem;
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .score {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .score-item {
      text-align: center;
    }

    .score-item .label {
      display: block;
      font-size: 0.85rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .score-item .value {
      font-size: 2rem;
      color: #1f2937;
    }

    .score .vs {
      color: #9ca3af;
      font-size: 1rem;
    }

    .canvas-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 450;
      background: #0b1020;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(11, 16, 32, 0.78);
      color: #ffffff;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .overlay h2 {
      font-size: 2rem;
    }

    .overlay p {
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .overlay.hidden {
      display: none;
    }

    .hint {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="sign">
      <h1>Hello</h1>
    </div>

    <div class="game-card">
      <div class="score">
        <div class="score-item">
          <span class="label">You</span>
          <span class="value" id="score-you">0</span>
        </div>
        <span class="vs">VS</span>
        <div class="score-item">
          <span class="label">AI</span>
          <span class="value" id="score-ai">0</span>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="game" width="800" height="450"></canvas>
        <div id="overlay" class="overlay">
          <h2>Click to serve</h2>
          <p>First to 11 wins</p>
        </div>
      </div>

      <p class="hint">Move: W / S or &uarr; / &darr; (or drag on the canvas) &nbsp;&middot;&nbsp; R = restart</p>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = overlay.querySelector('h2');
    const scoreYou = document.getElementById('score-you');
    const scoreAi = document.getElementById('score-ai');

    const W = canvas.width;
    const H = canvas.height;
    const PADDLE_W = 12;
    const PADDLE_H = 90;
    const OFFSET = 24;
    const BALL_R = 8;
    const PLAYER_SPEED = 7;
    const AI_SPEED = 4.6;
    const WIN_SCORE = 11;

    const player = { x: OFFSET, y: H / 2 - PADDLE_H / 2 };
    const ai = { x: W - OFFSET - PADDLE_W, y: H / 2 - PADDLE_H / 2 };
    const ball = { x: W / 2, y: H / 2, vx: 0, vy: 0 };

    let score = [0, 0];
    let winner = null;
    let running = false;
    let pointerActive = false;
    let pointerY = H / 2;
    const keys = {};

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function serve(dir) {
      ball.x = W / 2;
      ball.y = H / 2 + (Math.random() * 80 - 40);
      const angle = (Math.random() * 0.7 - 0.35) * Math.PI;
      const speed = 6;
      ball.vx = Math.cos(angle) * speed * dir;
      ball.vy = Math.sin(angle) * speed;
      running = true;
    }

    function updateScore() {
      scoreYou.textContent = score[0];
      scoreAi.textContent = score[1];
    }

    function pointTo(p) {
      score[p]++;
      updateScore();
      if (score[p] >= WIN_SCORE) {
        winner = p;
        running = false;
        overlayTitle.textContent = p === 0 ? 'You win!' : 'AI wins!';
        overlay.querySelector('p').textContent = 'Click to play again';
        overlay.classList.remove('hidden');
      } else {
        serve(p === 0 ? 1 : -1);
      }
    }

    function startGame() {
      score = [0, 0];
      winner = null;
      updateScore();
      overlay.classList.add('hidden');
      serve(1);
    }

    function hitPaddle(paddle, dir) {
      const rel = (ball.y - (paddle.y + PADDLE_H / 2)) / (PADDLE_H / 2);
      const angle = clamp(rel, -1, 1) * (Math.PI / 3);
      let speed = Math.hypot(ball.vx, ball.vy) * 1.03 + 0.15;
      if (speed > 13) speed = 13;
      ball.vx = Math.cos(angle) * speed * dir;
      ball.vy = Math.sin(angle) * speed;
    }

    function hitTest(p) {
      return (
        ball.x + BALL_R > p.x &&
        ball.x - BALL_R < p.x + PADDLE_W &&
        ball.y + BALL_R > p.y &&
        ball.y - BALL_R < p.y + PADDLE_H
      );
    }

    function update(dt) {
      const up = keys['w'] || keys['W'] || keys['ArrowUp'];
      const down = keys['s'] || keys['S'] || keys['ArrowDown'];

      if (up) {
        player.y -= PLAYER_SPEED * dt;
        pointerActive = false;
      } else if (down) {
        player.y += PLAYER_SPEED * dt;
        pointerActive = false;
      } else if (pointerActive) {
        player.y = pointerY - PADDLE_H / 2;
      }
      player.y = clamp(player.y, 0, H - PADDLE_H);

      const target = ball.vx > 0 ? ball.y : H / 2;
      if (ai.y + PADDLE_H / 2 < target - 4) ai.y += AI_SPEED * dt;
      else if (ai.y + PADDLE_H / 2 > target + 4) ai.y -= AI_SPEED * dt;
      ai.y = clamp(ai.y, 0, H - PADDLE_H);

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.y - BALL_R < 0) {
        ball.y = BALL_R;
        ball.vy = Math.abs(ball.vy);
      }
      if (ball.y + BALL_R > H) {
        ball.y = H - BALL_R;
        ball.vy = -Math.abs(ball.vy);
      }

      if (ball.vx < 0 && hitTest(player)) {
        ball.x = player.x + PADDLE_W + BALL_R;
        hitPaddle(player, 1);
      } else if (ball.vx > 0 && hitTest(ai)) {
        ball.x = ai.x - BALL_R;
        hitPaddle(ai, -1);
      }

      if (ball.x - BALL_R <= 0) pointTo(1);
      else if (ball.x + BALL_R >= W) pointTo(0);
    }

    function draw() {
      ctx.fillStyle = '#0b1020';
      ctx.fillRect(0, 0, W, H);

      ctx.setLineDash([10, 14]);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2, 10);
      ctx.lineTo(W / 2, H - 10);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x, player.y, PADDLE_W, PADDLE_H);
      ctx.fillRect(ai.x, ai.y, PADDLE_W, PADDLE_H);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    function loop(now) {
      const dt = Math.min((now - last) / 16.667, 3);
      last = now;
      if (running) update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    let last = performance.now();

    canvas.addEventListener('click', () => {
      if (winner !== null) {
        startGame();
      } else if (!running) {
        overlay.classList.add('hidden');
        serve(1);
      }
    });

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
      if (e.key === 'r' || e.key === 'R') startGame();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointerY = (e.clientY - rect.top) * (H / rect.height);
      pointerActive = true;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      pointerY = (e.touches[0].clientY - rect.top) * (H / rect.height);
      pointerActive = true;
    }, { passive: false });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
