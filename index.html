<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Hello — Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 2rem 1rem;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      max-width: 420px;
    }

    .sign {
      padding: 1.5rem 4rem;
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .sign h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.05em;
    }

    .calc-card {
      width: 100%;
      padding: 1.25rem;
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .calc-display {
      background: #0b1020;
      color: #ffffff;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      text-align: right;
      font-size: clamp(1.75rem, 8vw, 2.25rem);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
      white-space: nowrap;
      min-height: 3.5rem;
      line-height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      word-break: break-all;
    }

    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    .btn {
      height: 3.4rem;
      border: none;
      border-radius: 0.65rem;
      font-size: 1.3rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.12s ease, transform 0.05s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-digit {
      background: #f3f4f6;
      color: #111827;
    }

    .btn-digit:hover {
      filter: brightness(0.95);
    }

    .btn-op {
      background: #eaeef5;
      color: #374151;
    }

    .btn-op:hover {
      filter: brightness(0.95);
    }

    .btn-clear {
      background: #fef2f2;
      color: #dc2626;
    }

    .btn-clear:hover {
      filter: brightness(0.96);
    }

    .btn-eq {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
    }

    .btn-eq:hover {
      filter: brightness(1.05);
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-2-rows {
      grid-row: span 2;
    }

    .hint {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="sign">
      <h1>Hello</h1>
    </div>

    <div class="calc-card">
      <div class="calc-display" id="display" aria-live="polite">0</div>
      <div class="calc-buttons">
        <button class="btn btn-clear" data-key="C" aria-label="Clear">C</button>
        <button class="btn btn-digit" data-key="&#9003;" aria-label="Backspace">&#9003;</button>
        <button class="btn btn-op" data-key="/">&#247;</button>
        <button class="btn btn-op" data-key="*">&#215;</button>
        <button class="btn btn-digit" data-key="7">7</button>
        <button class="btn btn-digit" data-key="8">8</button>
        <button class="btn btn-digit" data-key="9">9</button>
        <button class="btn btn-op" data-key="-">&#8722;</button>
        <button class="btn btn-digit" data-key="4">4</button>
        <button class="btn btn-digit" data-key="5">5</button>
        <button class="btn btn-digit" data-key="6">6</button>
        <button class="btn btn-op" data-key="+">+</button>
        <button class="btn btn-digit" data-key="1">1</button>
        <button class="btn btn-digit" data-key="2">2</button>
        <button class="btn btn-digit" data-key="3">3</button>
        <button class="btn btn-eq span-2-rows" data-key="=">=</button>
        <button class="btn btn-digit span-2" data-key="0">0</button>
        <button class="btn btn-digit" data-key=".">.</button>
      </div>
      <p class="hint">Keyboard: digits, + &minus; &times; &divide;, Enter, Esc, Backspace</p>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');

    let acc = null;        // stored operand
    let op = null;         // pending operator
    let entry = '';        // current input
    let fresh = false;     // entry is a result; next digit starts a new number
    let error = false;

    function fmt(x) {
      let s = String(parseFloat(x.toPrecision(12)));
      if (s.length > 14) s = x.toExponential(8);
      return s;
    }

    function compute(a, b, o) {
      switch (o) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? Infinity : a / b;
      }
    }

    function showError() {
      error = true;
      acc = null;
      op = null;
      entry = '';
      fresh = false;
      display.textContent = 'Error';
    }

    function handleClear() {
      error = false;
      acc = null;
      op = null;
      entry = '';
      fresh = false;
      display.textContent = '0';
    }

    function handleDigit(d) {
      if (error) handleClear();
      if (fresh) {
        entry = '';
        fresh = false;
      }
      if (entry.length >= 14) return;
      entry = entry === '0' ? d : entry + d;
      display.textContent = entry;
    }

    function handleDot() {
      if (error) handleClear();
      if (fresh) {
        entry = '';
        fresh = false;
      }
      if (entry.includes('.')) return;
      entry = entry === '' ? '0.' : entry + '.';
      display.textContent = entry;
    }

    function handleOp(o) {
      if (error) return;
      if (fresh && acc !== null && op !== null) {
        op = o;
        return;
      }
      if (entry !== '') {
        const val = parseFloat(entry);
        if (acc === null) {
          acc = val;
        } else if (op !== null) {
          const r = compute(acc, val, op);
          if (!isFinite(r)) return showError();
          acc = r;
        }
        op = o;
        entry = '';
        fresh = false;
        display.textContent = fmt(acc);
      } else if (acc !== null) {
        op = o;
      }
    }

    function handleEquals() {
      if (error) return;
      if (op !== null && entry !== '') {
        const r = compute(acc, parseFloat(entry), op);
        if (!isFinite(r)) return showError();
        entry = fmt(r);
        acc = null;
        op = null;
        fresh = true;
        display.textContent = entry;
      } else if (op !== null && acc !== null) {
        entry = fmt(acc);
        acc = null;
        op = null;
        fresh = true;
        display.textContent = entry;
      }
    }

    function handleBackspace() {
      if (error || fresh) return;
      entry = entry.slice(0, -1);
      display.textContent = entry === '' ? '0' : entry;
    }

    document.querySelectorAll('.calc-buttons .btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.key;
        if (/^[0-9]$/.test(k)) handleDigit(k);
        else if (k === '.') handleDot();
        else if (k === 'C') handleClear();
        else if (k === '\u232B') handleBackspace();
        else if (k === '=') handleEquals();
        else handleOp(k);
      });
    });

    window.addEventListener('keydown', (e) => {
      if (/^[0-9]$/.test(e.key)) handleDigit(e.key);
      else if (e.key === '.') handleDot();
      else if (['+', '-', '*', '/'].includes(e.key)) {
        e.preventDefault();
        handleOp(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        handleEquals();
      } else if (e.key === 'Backspace') {
        handleBackspace();
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        handleClear();
      }
    });
  </script>
</body>
</html>
